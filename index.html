<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>PDF Összehasonlító és Rajzoló</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .menu {
            display: flex;
            flex-direction: column;
            width: 200px;
            padding: 10px;
            box-sizing: border-box;
            border-right: 1px solid #000;
        }
        .menu button, .menu input {
            margin-bottom: 10px;
        }
        #canvasContainer {
            position: relative;
            flex-grow: 1;
            border: 1px solid #000;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu">
            <h2>Rajzoló MenüR3</h2>
            <button onclick="startDrawing('line')">Vonal Rajzolása</button>
            <button onclick="startDrawing('circle')">Kör Rajzolása</button>
            <button onclick="startDrawing('text')">Felirat Elhelyezése</button>
            <input type="color" id="colorPicker" value="#000000">
            <input type="text" id="textInput" placeholder="Felirat szövege">
            <button onclick="deleteSelected()">Kijelölt Törlése</button>
        </div>
        <div id="canvasContainer">
            <canvas id="canvas1"></canvas>
            <canvas id="canvas2"></canvas>
            <canvas id="drawingCanvas"></canvas>
        </div>
    </div>
    <script>
        let drawingCanvas, drawingContext;
        let color = '#000000';
        let drawing = false;
        let drawType = '';
        let startX, startY;
        let objects = []; // Objektumok tárolása
        let selectedObject = null;

        document.addEventListener("DOMContentLoaded", () => {
            drawingCanvas = document.getElementById('drawingCanvas');
            drawingContext = drawingCanvas.getContext('2d');
            document.getElementById('colorPicker').addEventListener('input', (e) => {
                color = e.target.value;
            });

            drawingCanvas.addEventListener('mousedown', onMouseDown);
            drawingCanvas.addEventListener('mousemove', onMouseMove);
            drawingCanvas.addEventListener('mouseup', onMouseUp);
        });

        function startDrawing(type) {
            drawType = type;
            drawing = true;
        }

        function onMouseDown(e) {
            if (drawing) {
                const rect = drawingCanvas.getBoundingClientRect();
                startX = (e.clientX - rect.left);
                startY = (e.clientY - rect.top);
            } else {
                selectObject(e);
            }
        }

        function onMouseMove(e) {
            if (drawing) {
                const rect = drawingCanvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                drawingContext.strokeStyle = color;
                drawingContext.fillStyle = color;
                if (drawType === 'line') {
                    drawingContext.beginPath();
                    drawingContext.moveTo(startX, startY);
                    drawingContext.lineTo(x, y);
                    drawingContext.stroke();
                } else if (drawType === 'circle') {
                    const radius = Math.sqrt(Math.pow(x - startX, 2) + Math.pow(y - startY, 2));
                    drawingContext.beginPath();
                    drawingContext.arc(startX, startY, radius, 0, Math.PI * 2);
                    drawingContext.stroke();
                }
            }
        }

        function onMouseUp(e) {
            if (drawing) {
                const rect = drawingCanvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                if (drawType === 'line') {
                    const line = { type: 'line', startX, startY, endX: x, endY: y, color };
                    objects.push(line);
                } else if (drawType === 'circle') {
                    const radius = Math.sqrt(Math.pow(x - startX, 2) + Math.pow(y - startY, 2));
                    const circle = { type: 'circle', startX, startY, radius, color };
                    objects.push(circle);
                } else if (drawType === 'text') {
                    const text = document.getElementById('textInput').value;
                    const textObj = { type: 'text', x: startX, y: startY, text, color };
                    objects.push(textObj);
                }
                drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                drawAllObjects();
                drawing = false;
            }
        }

        function drawAllObjects() {
            drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            objects.forEach(obj => {
                if (obj.type === 'line') {
                    drawingContext.strokeStyle = obj.color;
                    drawingContext.beginPath();
                    drawingContext.moveTo(obj.startX, obj.startY);
                    drawingContext.lineTo(obj.endX, obj.endY);
                    drawingContext.stroke();
                } else if (obj.type === 'circle') {
                    drawingContext.strokeStyle = obj.color;
                    drawingContext.beginPath();
                    drawingContext.arc(obj.startX, obj.startY, obj.radius, 0, Math.PI * 2);
                    drawingContext.stroke();
                } else if (obj.type === 'text') {
                    drawingContext.fillStyle = obj.color;
                    drawingContext.textAlign = "center";
                    drawingContext.textBaseline = "middle";
                    drawingContext.fillText(obj.text, obj.x, obj.y);
                }
            });
        }

        function selectObject(e) {
            const rect = drawingCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            selectedObject = objects.find(obj => isPointOnObject(x, y, obj));
            if (selectedObject) {
                console.log('Object selected:', selectedObject);
            } else {
                console.log('No object selected');
            }
        }

        function isPointOnObject(x, y, obj) {
            const tolerance = 5; // Pontosság
            if (obj.type === 'line') {
                const distance = Math.abs((obj.endY - obj.startY) * x - (obj.endX - obj.startX) * y + obj.endX * obj.startY - obj.endY * obj.startX) /
                    Math.sqrt(Math.pow(obj.endY - obj.startY, 2) + Math.pow(obj.endX - obj.startX, 2));
                return distance < tolerance;
            } else if (obj.type === 'circle') {
                const distance = Math.sqrt(Math.pow(x - obj.startX, 2) + Math.pow(y - obj.startY, 2));
                return Math.abs(distance - obj.radius) < tolerance;
            } else if (obj.type === 'text') {
                const textWidth = drawingContext.measureText(obj.text).width;
                return x >= obj.x - textWidth / 2 && x <= obj.x + textWidth / 2 && y >= obj.y - 10 && y <= obj.y + 10;
            }
        }

        function deleteSelected() {
            if (selectedObject) {
                objects = objects.filter(obj => obj !== selectedObject);
                selectedObject = null;
                drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                drawAllObjects();
            }
        }
    </script>
</body>
</html>
