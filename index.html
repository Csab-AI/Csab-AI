<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>PDF Összehasonlító és Rajzoló</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .menu {
            display: flex;
            flex-direction: column;
            width: 200px;
            padding: 10px;
            box-sizing: border-box;
            border-right: 1px solid #000;
        }
        .menu button, .menu input {
            margin-bottom: 10px;
        }
        #canvasContainer {
            position: relative;
            flex-grow: 1;
            border: 1px solid #000;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #diffCanvas {
            border: 1px solid red;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu">
            <h2>Rajzoló Menü</h2>
            <input type="file" id="file1" accept="application/pdf">
            <input type="file" id="file2" accept="application/pdf">
            <button onclick="comparePDFs()">Összehasonlítás</button>
        </div>
        <div id="canvasContainer">
            <canvas id="canvas1"></canvas>
            <canvas id="canvas2"></canvas>
            <canvas id="drawingCanvas"></canvas>
            <canvas id="diffCanvas"></canvas>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script>
        let originalScale = 1;
        let offsetX = 0, offsetY = 0, scale = 1;
        let drawingCanvas, drawingContext;

        document.addEventListener("DOMContentLoaded", () => {
            drawingCanvas = document.getElementById('drawingCanvas');
            drawingContext = drawingCanvas.getContext('2d');
        });

        async function comparePDFs() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];

            if (file1 && file2) {
                await displayPDF(file1, 'canvas1');
                await displayPDF(file2, 'canvas2');
                fitCanvasesToContainer();
                resetView();
                highlightDifferences();
            } else {
                alert('Kérjük, válassza ki mindkét PDF fájlt.');
            }
        }

        async function displayPDF(file, canvasId) {
            const reader = new FileReader();
            reader.onload = async function() {
                const pdfData = new Uint8Array(reader.result);
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                const pdf = await loadingTask.promise;
                const pageNumber = 1;
                const page = await pdf.getPage(pageNumber);
                const viewport = page.getViewport({scale: 1});

                const canvas = document.getElementById(canvasId);
                const context = canvas.getContext('2d');
                const container = document.getElementById('canvasContainer');
                const scaleX = container.clientWidth / viewport.width;
                const scaleY = container.clientHeight / viewport.height;
                const scale = Math.min(scaleX, scaleY);
                const scaledViewport = page.getViewport({scale: scale});
                originalScale = scale;

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: scaledViewport
                };
                await page.render(renderContext).promise;

                if (canvasId === 'canvas1') {
                    drawingCanvas.width = canvas.width;
                    drawingCanvas.height = canvas.height;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function fitCanvasesToContainer() {
            const canvases = document.getElementsByTagName('canvas');
            for (let canvas of canvases) {
                canvas.style.width = '100%';
                canvas.style.height = '100%';
            }
        }

        function resetView() {
            scale = originalScale;
            offsetX = 0;
            offsetY = 0;
            updateTransform();
        }

        function highlightDifferences() {
            const canvas1 = document.getElementById('canvas1');
            const canvas2 = document.getElementById('canvas2');
            const diffCanvas = document.getElementById('diffCanvas');
            const context1 = canvas1.getContext('2d');
            const context2 = canvas2.getContext('2d');
            const diffContext = diffCanvas.getContext('2d');

            diffCanvas.width = canvas1.width;
            diffCanvas.height = canvas1.height;
            diffCanvas.style.display = 'block';

            const imgData1 = context1.getImageData(0, 0, canvas1.width, canvas1.height);
            const imgData2 = context2.getImageData(0, 0, canvas2.width, canvas2.height);
            const diffImgData = diffContext.createImageData(canvas1.width, canvas1.height);

            for (let i = 0; i < imgData1.data.length; i += 4) {
                const r1 = imgData1.data[i];
                const g1 = imgData1.data[i + 1];
                const b1 = imgData1.data[i + 2];
                const a1 = imgData1.data[i + 3];

                const r2 = imgData2.data[i];
                const g2 = imgData2.data[i + 1];
                const b2 = imgData2.data[i + 2];
                const a2 = imgData2.data[i + 3];

                const isDifferent = Math.abs(r1 - r2) > 50 || Math.abs(g1 - g2) > 50 || Math.abs(b1 - b2) > 50 || Math.abs(a1 - a2) > 50;

                if (isDifferent) {
                    diffImgData.data[i] = 255; // Red
                    diffImgData.data[i + 1] = 0; // Green
                    diffImgData.data[i + 2] = 0; // Blue
                    diffImgData.data[i + 3] = 255; // Alpha
                } else {
                    diffImgData.data[i] = imgData1.data[i];
                    diffImgData.data[i + 1] = imgData1.data[i + 1];
                    diffImgData.data[i + 2] = imgData1.data[i + 2];
                    diffImgData.data[i + 3] = imgData1.data[i + 3];
                }
            }

            diffContext.putImageData(diffImgData, 0, 0);
        }

        function updateTransform() {
            const canvases = document.getElementsByTagName('canvas');
            for (let canvas of canvases) {
                canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            }
        }
    </script>
</body>
</html>
