<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>PDF Összehasonlító</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
        }
        .menu {
            width: 200px;
            padding-right: 20px;
            border-right: 1px solid #000;
        }
        .canvas-container {
            flex-grow: 1;
            position: relative;
            height: 500px;
            overflow: hidden;
            background: #f0f0f0;
            border: 1px solid #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: grab;
        }
        .button-group {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>PDF Összehasonlító1</h1>
        <input type="file" id="file1" accept="application/pdf">
        <input type="file" id="file2" accept="application/pdf">
        <button onclick="comparePDFs()">Összehasonlítás</button>
        <div>
            <label>Átlátszóság:</label>
            <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="button-group">
            <button onclick="startBlinking()">Villogtatás</button>
            <button onclick="stopBlinking()">Villogtatás Leállítása</button>
            <button onclick="resetView()">Nézet Visszaállítása</button>
            <button onclick="saveCurrentView()">Aktuális Nézet Mentése</button>
        </div>
    </div>
    <div class="canvas-container">
        <canvas id="canvas1"></canvas>
        <canvas id="canvas2"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsPDF/2.5.1/jspdf.umd.min.js"></script>
    <script>
        let blinking = false;
        let blinkInterval;
        let scale = 1;
        let offsetX = 0, offsetY = 0;
        let isDragging = false;
        let startX, startY;
        let file1Name = '', file2Name = '';

        async function comparePDFs() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            if (file1 && file2) {
                file1Name = file1.name;
                file2Name = file2.name;
                
                const canvas1 = document.getElementById('canvas1');
                const canvas2 = document.getElementById('canvas2');
                
                // Reset canvas sizes before rendering
                resetCanvasSize(canvas1);
                resetCanvasSize(canvas2);
                
                // Display PDFs
                await displayPDF(file1, canvas1);
                await displayPDF(file2, canvas2);
                
                // Adjust canvas sizes to fit the container
                fitCanvasesToContainer();
            } else {
                alert('Kérjük, válassza ki mindkét PDF fájlt.');
            }
        }

        async function displayPDF(file, canvas) {
            const reader = new FileReader();
            reader.onload = async function() {
                const pdfData = new Uint8Array(reader.result);
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                const pdf = await loadingTask.promise;
                const pageNumber = 1;
                const page = await pdf.getPage(pageNumber);

                const viewport = page.getViewport({scale: 1});
                const context = canvas.getContext('2d');
                const container = document.querySelector('.canvas-container');
                
                // Get container size
                const containerWidth = container.clientWidth;
                const containerHeight = container.clientHeight;

                // Calculate the scale to fit the page in the container while maintaining aspect ratio
                const scaleX = containerWidth / viewport.width;
                const scaleY = containerHeight / viewport.height;
                const scale = Math.min(scaleX, scaleY);

                const scaledViewport = page.getViewport({scale: scale});

                // Set canvas dimensions
                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: scaledViewport
                };
                await page.render(renderContext).promise;
                
                // Update canvas size for responsive layout
                updateCanvasSize(canvas, containerWidth, containerHeight, viewport.width, viewport.height);
            };
            reader.readAsArrayBuffer(file);
        }

        function resetCanvasSize(canvas) {
            canvas.style.width = 'auto';
            canvas.style.height = 'auto';
        }

        function updateCanvasSize(canvas, containerWidth, containerHeight, pdfWidth, pdfHeight) {
            const aspectRatio = pdfWidth / pdfHeight;
            const containerAspectRatio = containerWidth / containerHeight;

            if (containerAspectRatio > aspectRatio) {
                canvas.style.height = '100%';
                canvas.style.width = 'auto';
            } else {
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
            }
        }

        function fitCanvasesToContainer() {
            const canvases = document.getElementsByTagName('canvas');
            for (let canvas of canvases) {
                canvas.style.width = '100%';
                canvas.style.height = '100%';
            }
        }

        function updateAlpha() {
            const alpha = document.getElementById('alphaSlider').value;
            const canvas2 = document.getElementById('canvas2');
            canvas2.style.opacity = alpha;
        }

        document.getElementById('alphaSlider').addEventListener('input', updateAlpha);

        function startBlinking() {
            blinking = true;
            blink();
        }

        function stopBlinking() {
            blinking = false;
            clearInterval(blinkInterval);
        }

        function blink() {
            if (!blinking) return;
            const canvas2 = document.getElementById('canvas2');
            canvas2.style.opacity = canvas2.style.opacity == 0 ? 1 : 0;
            blinkInterval = setTimeout(blink, 500);
        }

        function resetView() {
            scale = 1;
            offsetX = 0;
            offsetY = 0;
            updateTransform();
        }

        function updateTransform() {
            const canvases = document.getElementsByTagName('canvas');
            for (let canvas of canvases) {
                canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            }
        }

        async function saveCurrentView() {
            const canvases = document.getElementsByTagName('canvas');
            if (canvases.length === 0) return;

            // Create a temporary canvas to combine the views
            const tempCanvas = document.createElement('canvas');
            const tempContext = tempCanvas.getContext('2d');

            // Set the canvas size
            const container = document.querySelector('.canvas-container');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            tempCanvas.width = containerWidth;
            tempCanvas.height = containerHeight;

            // Draw the canvases onto the temporary canvas
            for (const canvas of canvases) {
                tempContext.drawImage(canvas, 0, 0, containerWidth, containerHeight);
            }

            // Convert the temporary canvas to PNG
            const imgData = tempCanvas.toDataURL('image/png');

            // Create PDF
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'pt', 'a4');

            // Add the combined image
            pdf.addImage(imgData, 'PNG', 10, 10, 190, 277);

            // Add file names
            pdf.setFontSize(12);
            pdf.text(`File 1: ${file1Name}`, 10, 290);
            pdf.text(`File 2: ${file2Name}`, 10, 310);

            // Save the PDF
            pdf.save('saved_view.pdf');
        }

        window.addEventListener('resize', fitCanvasesToContainer);

        // Event listeners for dragging and zooming
        const container = document.querySelector('.canvas-container');
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
            container.style.cursor = 'grabbing';
        });

        container.addEventListener('mouseup', () => {
            isDragging = false;
            container.style.cursor = 'grab';
        });

        container.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = e.clientX - startX;
                offsetY = e.clientY - startY;
                updateTransform();
            }
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            const delta = e.deltaY > 0 ? 1 / zoomFactor : zoomFactor;
            scale *= delta;
            updateTransform();
        });
    </script>
</body>
</html>
