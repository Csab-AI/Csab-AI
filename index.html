<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Comparator and Drawer (Vector & Native Export)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; overflow: hidden; background: #f4f4f5; }
        .container { display: flex; height: 100vh; width: 100vw; }
        .menu { display: flex; flex-direction: column; width: 250px; padding: 15px; box-sizing: border-box; background: #fff; border-right: 1px solid #ddd; z-index: 10; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
        .menu button, .menu input { margin-bottom: 12px; padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .menu button { cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 4px; transition: background 0.2s; }
        .menu button:hover { background: #1d4ed8; }
        .menu button.secondary { background: #e5e7eb; color: #1f2937; }
        .menu button.secondary:hover { background: #d1d5db; }
        #canvasContainer { position: relative; flex-grow: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; background: #525659; }
        .canvas-wrapper { position: relative; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        canvas { position: absolute; top: 0; left: 0; }
        .section { margin-bottom: 20px; border-bottom: 1px solid #ddd; padding-bottom: 15px; }
        .section h2 { margin-top: 0; font-size: 16px; color: #1f2937; }
        .small-text { font-size: 0.75em; color: #6b7280; }
        
        /* A fabric.js canvas-t tartalmazó div */
        .canvas-container { position: absolute !important; top: 0; left: 0; z-index: 5; }
        #canvas1 { z-index: 1; }
        #canvas2 { z-index: 2; pointer-events: none; /* Hogy a kattintás átmenjen a rajzvászonra */ }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu">
            <div class="section">
                <h2>1. PDF Összehasonlítás</h2>
                <label for="file1" class="small-text">Alap terv (File 1):</label>
                <input type="file" id="file1" accept="application/pdf">
                <label for="file2" class="small-text">Módosított terv (File 2):</label>
                <input type="file" id="file2" accept="application/pdf">
                <button onclick="comparePDFs()">Betöltés és Összehasonlítás</button>
                <label class="small-text">Villogtatás (Opacity):</label>
                <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="0.5">
                <button class="secondary" onclick="startBlinking()">Villogtatás Indítása</button>
                <button class="secondary" onclick="stopBlinking()">Villogtatás Leállítása</button>
            </div>
            <div class="section">
                <h2>2. Vektoros Annotáció</h2>
                <p class="small-text">A formák mozgathatók és méretezhetők. Törlés: kijelölés + Delete gomb.</p>
                <input type="color" id="colorPicker" value="#ef4444">
                <button class="secondary" onclick="addText()">Szöveg Hozzáadása</button>
                <button class="secondary" onclick="addCircle()">Kör Hozzáadása</button>
                <button class="secondary" onclick="addLine()">Vonal Hozzáadása</button>
            </div>
            <div class="section">
                <h2>3. Exportálás (Natív PDF)</h2>
                <button onclick="exportNativePDF()">Exportálás (File 1 alapra)</button>
            </div>
            <div class="section small-text">
                <p>PDF Comparator (Vector Beta)<br>Kliensoldali működés (Backend nélkül).</p>
            </div>
        </div>
        <div id="canvasContainer">
            <div class="canvas-wrapper" id="wrapper">
                <canvas id="canvas1"></canvas>
                <canvas id="canvas2"></canvas>
                <canvas id="drawingCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <script>
        let blinking = false;
        let blinkInterval;
        let fabricCanvas;
        let pdfScale = 1; // Eltároljuk a renderelési skálát a pontos PDF exporthoz
        let originalPdfBytes = null; // Az 1-es fájl eredeti byte-tömbje a pdf-lib számára

        document.addEventListener("DOMContentLoaded", () => {
            // pdf.js worker beállítása
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            
            // Fabric.js inicializálása
            fabricCanvas = new fabric.Canvas('drawingCanvas');
            
            // Objektum törlése Delete gombbal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    const activeObjects = fabricCanvas.getActiveObjects();
                    if (activeObjects.length) {
                        fabricCanvas.discardActiveObject();
                        activeObjects.forEach(function(object) {
                            fabricCanvas.remove(object);
                        });
                    }
                }
            });

            document.getElementById('alphaSlider').addEventListener('input', (e) => {
                document.getElementById('canvas2').style.opacity = e.target.value;
            });
        });

        async function comparePDFs() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            if (file1 && file2) {
                // Eltároljuk az első fájlt binárisan a későbbi natív exporthoz
                originalPdfBytes = await file1.arrayBuffer(); 
                
                await displayPDF(file1, 'canvas1');
                await displayPDF(file2, 'canvas2');
            } else {
                alert('Kérlek, válaszd ki mindkét PDF fájlt!');
            }
        }

        async function displayPDF(file, canvasId) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
            const page = await pdf.getPage(1);
            
            // Fix szélességű renderelés a jobb kezelhetőségért (pl. 1200px)
            const desiredWidth = 1200;
            const viewport = page.getViewport({scale: 1});
            pdfScale = desiredWidth / viewport.width;
            const scaledViewport = page.getViewport({scale: pdfScale});

            const canvas = document.getElementById(canvasId);
            const context = canvas.getContext('2d');
            
            canvas.width = scaledViewport.width;
            canvas.height = scaledViewport.height;
            canvas.style.width = `${scaledViewport.width}px`;
            canvas.style.height = `${scaledViewport.height}px`;

            // A wrapper és a fabric vászon méretének igazítása
            if (canvasId === 'canvas1') {
                const wrapper = document.getElementById('wrapper');
                wrapper.style.width = `${scaledViewport.width}px`;
                wrapper.style.height = `${scaledViewport.height}px`;
                
                fabricCanvas.setWidth(scaledViewport.width);
                fabricCanvas.setHeight(scaledViewport.height);
            }

            await page.render({ canvasContext: context, viewport: scaledViewport }).promise;
        }

        // --- FABRIC.JS VEKTOROS RAJZOLÁS ---
        
        function getColor() {
            return document.getElementById('colorPicker').value;
        }

        function addText() {
            const text = new fabric.IText('Kattints duplán a szerkesztéshez', {
                left: fabricCanvas.width / 2 - 100,
                top: fabricCanvas.height / 2,
                fontFamily: 'Arial',
                fill: getColor(),
                fontSize: 24 * pdfScale
            });
            fabricCanvas.add(text).setActiveObject(text);
        }

        function addCircle() {
            const circle = new fabric.Circle({
                radius: 30 * pdfScale,
                fill: 'transparent',
                stroke: getColor(),
                strokeWidth: 3 * pdfScale,
                left: fabricCanvas.width / 2,
                top: fabricCanvas.height / 2,
                originX: 'center',
                originY: 'center'
            });
            fabricCanvas.add(circle).setActiveObject(circle);
        }

        function addLine() {
            const line = new fabric.Line([50, 100, 200, 200], {
                left: fabricCanvas.width / 2,
                top: fabricCanvas.height / 2,
                stroke: getColor(),
                strokeWidth: 3 * pdfScale
            });
            // Hogy a vonal végeit lehessen mozgatni, érdemes extra beállításokat tenni,
            // de egyelőre skálázható és forgatható objektumként jön létre.
            line.setControlsVisibility({
                bl: false, br: false, tl: false, tr: false, mt: false, mb: false
            });
            fabricCanvas.add(line).setActiveObject(line);
        }

        // --- VILLOGTATÁS ---
        function startBlinking() {
            blinking = true;
            blink();
        }

        function stopBlinking() {
            blinking = false;
            clearTimeout(blinkInterval);
            document.getElementById('canvas2').style.opacity = document.getElementById('alphaSlider').value;
        }

        function blink() {
            if (!blinking) return;
            const canvas2 = document.getElementById('canvas2');
            canvas2.style.opacity = canvas2.style.opacity == 0 ? 1 : 0;
            blinkInterval = setTimeout(blink, 500);
        }

        // --- PDF-LIB NATÍV EXPORTÁLÁS ---
        
        // Segédfüggvény: HEX to RGB (0-1 tartomány)
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16) / 255,
                g: parseInt(result[2], 16) / 255,
                b: parseInt(result[3], 16) / 255
            } : { r: 0, g: 0, b: 0 };
        }

        async function exportNativePDF() {
            if (!originalPdfBytes) {
                alert('Még nincs betöltve PDF!');
                return;
            }

            const { PDFDocument, rgb } = PDFLib;
            
            // Betöltjük az eredeti PDF fájlt a memóriába
            const pdfDoc = await PDFDocument.load(originalPdfBytes);
            const pages = pdfDoc.getPages();
            const page = pages[0]; // Első oldal
            const { height } = page.getSize();

            // Végigmegyünk a Fabric.js vásznon lévő összes vektoros elemen
            const objects = fabricCanvas.getObjects();
            
            for (let obj of objects) {
                // A böngésző pixeleket vissza kell osztani a pdfScale-lel, hogy megkapjuk a natív PDF pontokat
                const x = obj.left / pdfScale;
                // A PDF-ben az Y tengely lentről felfelé nő, a böngészőben fentről lefelé
                const y = height - (obj.top / pdfScale); 
                
                const colorObj = hexToRgb(obj.stroke || obj.fill);
                const pdfColor = rgb(colorObj.r, colorObj.g, colorObj.b);

                if (obj.type === 'i-text' || obj.type === 'text') {
                    // Az i-text origója máshol van, ezért az Y-t picit korrigáljuk a font méretével
                    const fontSize = obj.fontSize / pdfScale;
                    page.drawText(obj.text, {
                        x: x,
                        y: y - fontSize, 
                        size: fontSize,
                        color: pdfColor
                    });
                } 
                else if (obj.type === 'circle') {
                    const radius = (obj.radius * obj.scaleX) / pdfScale;
                    page.drawCircle({
                        x: x + radius,
                        y: y - radius,
                        size: radius,
                        borderColor: pdfColor,
                        borderWidth: obj.strokeWidth / pdfScale,
                        color: rgb(1,1,1), // Átlátszóság beállítása a pdf-lib-ben komplexebb, itt most kitöltetlen maradna
                        opacity: 0, // Kitöltés átlátszó
                        borderOpacity: 1
                    });
                }
                else if (obj.type === 'line') {
                    // Vonal koordinátáinak leképezése
                    const x1 = (obj.left + obj.x1 * obj.scaleX) / pdfScale;
                    const y1 = height - ((obj.top + obj.y1 * obj.scaleY) / pdfScale);
                    const x2 = (obj.left + obj.x2 * obj.scaleX) / pdfScale;
                    const y2 = height - ((obj.top + obj.y2 * obj.scaleY) / pdfScale);
                    
                    page.drawLine({
                        start: { x: x1, y: y1 },
                        end: { x: x2, y: y2 },
                        thickness: obj.strokeWidth / pdfScale,
                        color: pdfColor
                    });
                }
            }

            // PDF generálása és letöltése
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'annotalt_tervrajz.pdf';
            link.click();
        }
    </script>
</body>
</html>
