<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>PDF Összehasonlító és Rajzoló</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .menu {
            display: flex;
            flex-direction: column;
            width: 200px;
            padding: 10px;
            box-sizing: border-box;
            border-right: 1px solid #000;
        }
        .menu button, .menu input {
            margin-bottom: 10px;
        }
        #canvasContainer {
            position: relative;
            flex-grow: 1;
            border: 1px solid #000;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu">
            <h2>Rajzoló Menü</h2>
            <button onclick="startDrawing('line')">Vonal Rajzolása</button>
            <button onclick="startDrawing('circle')">Kör Rajzolása</button>
            <button onclick="startDrawing('rect')">Téglalap Rajzolása</button>
            <button onclick="startDrawing('text')">Felirat Elhelyezése</button>
            <button onclick="selectElement()">Elem Kijelölése</button>
            <input type="color" id="colorPicker" value="#000000">
            <input type="text" id="textInput" placeholder="Felirat szövege">
            <input type="file" id="file1" accept="application/pdf">
            <input type="file" id="file2" accept="application/pdf">
            <button onclick="comparePDFs()">Összehasonlítás</button>
            <label>Átlátszóság:</label>
            <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="0.5">
            <button onclick="startBlinking()">Villogtatás</button>
            <button onclick="stopBlinking()">Villogtatás Leállítása</button>
            <button onclick="resetView()">Eredeti nézet visszaállítása</button>
            <button onclick="saveAsPDF()">Mentés PDF-be</button>
        </div>
        <div id="canvasContainer">
            <canvas id="canvas1"></canvas>
            <canvas id="canvas2"></canvas>
            <canvas id="drawingCanvas"></canvas>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.3.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.5.0-alpha1/html2canvas.min.js"></script>
    <script>
        let blinking = false;
        let blinkInterval;
        let originalScale = 1;
        let offsetX = 0, offsetY = 0, scale = 1;
        let drawing = false;
        let drawType = '';
        let startX, startY;
        let drawingCanvas, drawingContext;
        let color = '#000000';
        let file1Name = '';
        let file2Name = '';
        let elements = [];
        let selectedElement = null;
        let isDragging = false;
        let startDragX, startDragY;

        document.addEventListener("DOMContentLoaded", () => {
            drawingCanvas = document.getElementById('drawingCanvas');
            drawingContext = drawingCanvas.getContext('2d');
            document.getElementById('colorPicker').addEventListener('input', (e) => {
                color = e.target.value;
            });
        });

        async function comparePDFs() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            if (file1 && file2) {
                file1Name = file1.name;
                file2Name = file2.name;
                await displayPDF(file1, 'canvas1');
                await displayPDF(file2, 'canvas2');
                fitCanvasesToContainer();
                resetView();
            } else {
                alert('Kérjük, válassza ki mindkét PDF fájlt.');
            }
        }

        async function displayPDF(file, canvasId) {
            const reader = new FileReader();
            reader.onload = async function() {
                const pdfData = new Uint8Array(reader.result);
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                const pdf = await loadingTask.promise;
                const pageNumber = 1;
                const page = await pdf.getPage(pageNumber);
                const viewport = page.getViewport({scale: 1});

                const canvas = document.getElementById(canvasId);
                const context = canvas.getContext('2d');
                const container = document.getElementById('canvasContainer');
                const scaleX = container.clientWidth / viewport.width;
                const scaleY = container.clientHeight / viewport.height;
                const scale = Math.min(scaleX, scaleY);
                const scaledViewport = page.getViewport({scale: scale});
                originalScale = scale;

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: scaledViewport
                };
                await page.render(renderContext).promise;

                drawingCanvas.width = canvas.width;
                drawingCanvas.height = canvas.height;
            };
            reader.readAsArrayBuffer(file);
        }

        function fitCanvasesToContainer() {
            const canvases = document.getElementsByTagName('canvas');
            for (let canvas of canvases) {
                canvas.style.width = '100%';
                canvas.style.height = '100%';
            }
        }

        function updateAlpha() {
            const alpha = document.getElementById('alphaSlider').value;
            const canvas2 = document.getElementById('canvas2');
            canvas2.style.opacity = alpha;
        }

        document.getElementById('alphaSlider').addEventListener('input', updateAlpha);

        function startBlinking() {
            blinking = true;
            blink();
        }

        function stopBlinking() {
            blinking = false;
            clearInterval(blinkInterval);
        }

        function blink() {
            if (!blinking) return;
            const canvas2 = document.getElementById('canvas2');
            canvas2.style.opacity = canvas2.style.opacity == 0 ? 1 : 0;
            blinkInterval = setTimeout(blink, 500);
        }

        function resetView() {
            scale = originalScale;
            offsetX = 0;
            offsetY = 0;
            updateTransform();
        }

        function startDrawing(type) {
            drawType = type;
            drawing = true;
            document.getElementById('canvasContainer').style.cursor = 'crosshair';
        }

        function stopDrawing() {
            drawing = false;
            drawType = '';
            document.getElementById('canvasContainer').style.cursor = 'default';
        }

        function draw(e) {
            if (!drawing) return;

            const rect = drawingCanvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / scale;
            const y = (e.clientY - rect.top) / scale;

            drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            redrawElements();

            drawingContext.strokeStyle = color;
            drawingContext.fillStyle = color;

            if (drawType === 'line') {
                drawingContext.beginPath();
                drawingContext.moveTo(startX, startY);
                drawingContext.lineTo(x, y);
                drawingContext.stroke();
                saveElement({ type: 'line', startX, startY, x, y, color });
                stopDrawing();
            } else if (drawType === 'circle') {
                const radius = Math.sqrt(Math.pow(x - startX, 2) + Math.pow(y - startY, 2));
                drawingContext.beginPath();
                drawingContext.arc(startX, startY, radius, 0, Math.PI * 2);
                drawingContext.stroke();
                saveElement({ type: 'circle', startX, startY, radius, color });
                stopDrawing();
            } else if (drawType === 'rect') {
                const width = x - startX;
                const height = y - startY;
                drawingContext.strokeRect(startX, startY, width, height);
                saveElement({ type: 'rect', startX, startY, width, height, color });
                stopDrawing();
            } else if (drawType === 'text') {
                const text = document.getElementById('textInput').value;
                drawingContext.textAlign = "center";
                drawingContext.textBaseline = "middle";
                drawingContext.fillText(text, x, y);
                saveElement({ type: 'text', x, y, text, color });
                stopDrawing();
                return;
            }
        }

        function saveElement(element) {
            elements.push(element);
            redrawElements();
        }

        function redrawElements() {
            drawingContext.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            elements.forEach(element => {
                drawingContext.strokeStyle = element.color;
                drawingContext.fillStyle = element.color;
                if (element.type === 'line') {
                    drawingContext.beginPath();
                    drawingContext.moveTo(element.startX, element.startY);
                    drawingContext.lineTo(element.x, element.y);
                    drawingContext.stroke();
                } else if (element.type === 'circle') {
                    drawingContext.beginPath();
                    drawingContext.arc(element.startX, element.startY, element.radius, 0, Math.PI * 2);
                    drawingContext.stroke();
                } else if (element.type === 'rect') {
                    drawingContext.strokeRect(element.startX, element.startY, element.width, element.height);
                } else if (element.type === 'text') {
                    drawingContext.textAlign = "center";
                    drawingContext.textBaseline = "middle";
                    drawingContext.fillText(element.text, element.x, element.y);
                }
            });
        }

        function selectElement() {
            drawType = 'select';
            document.getElementById('canvasContainer').style.cursor = 'pointer';
        }

        function findElement(x, y) {
            for (let i = elements.length - 1; i >= 0; i--) {
                const element = elements[i];
                if (element.type === 'line') {
                    const dx = element.x - element.startX;
                    const dy = element.y - element.startY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    const distanceToStart = Math.sqrt((x - element.startX) ** 2 + (y - element.startY) ** 2);
                    const distanceToEnd = Math.sqrt((x - element.x) ** 2 + (y - element.y) ** 2);
                    if (distanceToStart + distanceToEnd <= distance + 5) {
                        return element;
                    }
                } else if (element.type === 'circle') {
                    const distance = Math.sqrt((x - element.startX) ** 2 + (y - element.startY) ** 2);
                    if (distance <= element.radius) {
                        return element;
                    }
                } else if (element.type === 'rect') {
                    if (x >= element.startX && x <= element.startX + element.width && y >= element.startY && y <= element.startY + element.height) {
                        return element;
                    }
                } else if (element.type === 'text') {
                    const textWidth = drawingContext.measureText(element.text).width;
                    if (x >= element.x - textWidth / 2 && x <= element.x + textWidth / 2 && y >= element.y - 10 && y <= element.y + 10) {
                        return element;
                    }
                }
            }
            return null;
        }

        drawingCanvas.addEventListener('mousedown', (e) => {
            const rect = drawingCanvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / scale;
            const y = (e.clientY - rect.top) / scale;

            if (drawType === 'select') {
                selectedElement = findElement(x, y);
                if (selectedElement) {
                    isDragging = true;
                    startDragX = x;
                    startDragY = y;
                }
            } else {
                startX = x;
                startY = y;
                draw(e);
            }
        });

        drawingCanvas.addEventListener('mousemove', (e) => {
            if (isDragging && selectedElement) {
                const rect = drawingCanvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / scale;
                const y = (e.clientY - rect.top) / scale;

                const dx = x - startDragX;
                const dy = y - startDragY;

                if (selectedElement.type === 'line') {
                    selectedElement.startX += dx;
                    selectedElement.startY += dy;
                    selectedElement.x += dx;
                    selectedElement.y += dy;
                } else if (selectedElement.type === 'circle' || selectedElement.type === 'rect') {
                    selectedElement.startX += dx;
                    selectedElement.startY += dy;
                } else if (selectedElement.type === 'text') {
                    selectedElement.x += dx;
                    selectedElement.y += dy;
                }

                startDragX = x;
                startDragY = y;

                redrawElements();
            }
        });

        drawingCanvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        async function saveAsPDF() {
            const { jsPDF } = window.jspdf;
            const container = document.getElementById('canvasContainer');

            html2canvas(container, {
                scale: 2,
                useCORS: true
            }).then(canvas => {
                const pdf = new jsPDF({
                    orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
                    unit: 'px',
                    format: [canvas.width, canvas.height]
                });

                const imgData = canvas.toDataURL('image/png');
                pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);

                // Adding the file names to the PDF
                pdf.setFontSize(10);
                pdf.text(`File 1: ${file1Name}`, 10, pdf.internal.pageSize.height - 20);
                pdf.text(`File 2: ${file2Name}`, 10, pdf.internal.pageSize.height - 10);

                pdf.save('current_view.pdf');
            });
        }

        window.addEventListener('resize', fitCanvasesToContainer);

        // Zoom and Pan functionality
        const container = document.getElementById('canvasContainer');
        container.addEventListener('mousedown', (e) => {
            if (!drawing && !isDragging) {
                canvasDragging = true;
                canvasStartX = e.clientX - offsetX;
                canvasStartY = e.clientY - offsetY;
            }
        });

        container.addEventListener('mouseup', () => {
            if (canvasDragging) {
                canvasDragging = false;
            }
        });

        container.addEventListener('mousemove', (e) => {
            if (canvasDragging) {
                offsetX = e.clientX - canvasStartX;
                offsetY = e.clientY - canvasStartY;
                updateTransform();
            }
        });

        container.addEventListener('wheel', (e) => {
            e.prevent.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale *= delta;
            offsetX = (e.clientX - container.clientWidth / 2) * (1 - delta) + offsetX;
            offsetY = (e.clientY - container.clientHeight / 2) * (1 - delta) + offsetY;
            updateTransform();
        });

        function updateTransform() {
            const canvases = document.getElementsByTagName('canvas');
            for (let canvas of canvases) {
                canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            }
        }
    </script>
</body>
</html>
