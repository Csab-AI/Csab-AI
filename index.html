<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>PDF Összehasonlító</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .menu {
            width: 100%;
            padding: 10px;
            border-bottom: 1px solid #000;
            box-sizing: border-box;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-shrink: 0;
        }
        .canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: auto;
            background: #f0f0f0;
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .button-group {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>PDF sszehasonlító</h1>
        <input type="file" id="file1" accept="application/pdf">
        <input type="file" id="file2" accept="application/pdf">
        <button onclick="comparePDFs()">Összehasonlítás</button>
        <label>Átlátszóság:</label>
        <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="0.5">
        <div class="button-group">
            <button onclick="startBlinking()">Villogtatás</button>
            <button onclick="stopBlinking()">Villogtatás Leállítása</button>
            <button onclick="resetView()">Nézet Visszaállítása</button>
            <button onclick="saveCurrentView()">Aktuális Nézet Mentése</button>
        </div>
    </div>
    <div class="canvas-container" id="canvasContainer">
        <canvas id="canvas1"></canvas>
        <canvas id="canvas2"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsPDF/2.5.1/jspdf.umd.min.js"></script>
    <script>
        let blinking = false;
        let blinkInterval;
        let file1Name = '', file2Name = '';

        async function comparePDFs() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            if (file1 && file2) {
                file1Name = file1.name;
                file2Name = file2.name;
                await displayPDF(file1, 'canvas1');
                await displayPDF(file2, 'canvas2');
            } else {
                alert('Kérjük, válassza ki mindkét PDF fájlt.');
            }
        }

        async function displayPDF(file, canvasId) {
            const canvas = document.getElementById(canvasId);
            const context = canvas.getContext('2d');
            const reader = new FileReader();
            reader.onload = async function() {
                const pdfData = new Uint8Array(reader.result);
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                const pdf = await loadingTask.promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({scale: 1});

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                await page.render(renderContext).promise;
            };
            reader.readAsArrayBuffer(file);
        }

        function updateAlpha() {
            const alpha = document.getElementById('alphaSlider').value;
            document.getElementById('canvas2').style.opacity = alpha;
        }

        document.getElementById('alphaSlider').addEventListener('input', updateAlpha);

        function startBlinking() {
            blinking = true;
            blink();
        }

        function stopBlinking() {
            blinking = false;
            clearInterval(blinkInterval);
        }

        function blink() {
            if (!blinking) return;
            const canvas2 = document.getElementById('canvas2');
            canvas2.style.opacity = canvas2.style.opacity == 0 ? 1 : 0;
            blinkInterval = setTimeout(blink, 500);
        }

        function resetView() {
            document.getElementById('canvasContainer').scrollTo(0, 0);
        }

        async function saveCurrentView() {
            const canvas1 = document.getElementById('canvas1');
            const canvas2 = document.getElementById('canvas2');
            const tempCanvas = document.createElement('canvas');
            const tempContext = tempCanvas.getContext('2d');

            const container = document.querySelector('.canvas-container');
            tempCanvas.width = container.scrollWidth;
            tempCanvas.height = container.scrollHeight;

            tempContext.drawImage(canvas1, 0, 0);
            tempContext.globalAlpha = document.getElementById('canvas2').style.opacity;
            tempContext.drawImage(canvas2, 0, 0);

            const imgData = tempCanvas.toDataURL('image/png');

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'pt', [tempCanvas.width, tempCanvas.height]);

            pdf.addImage(imgData, 'PNG', 0, 0, tempCanvas.width, tempCanvas.height);
            pdf.setFontSize(12);
            pdf.text(`File 1: ${file1Name}`, 10, tempCanvas.height - 20);
            pdf.text(`File 2: ${file2Name}`, 10, tempCanvas.height - 10);

            pdf.save('saved_view.pdf');
        }
    </script>
</body>
</html>
