<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>PDF Összehasonlító</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .menu {
            width: 200px;
            padding: 10px;
            border-right: 1px solid #000;
            box-sizing: border-box;
        }
        .canvas-container {
            flex-grow: 1;
            position: relative;
            overflow: auto;
            background: #f0f0f0;
            border: 1px solid #000;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .button-group {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h1>PDF Összehasonlító</h1>
        <input type="file" id="file1" accept="application/pdf">
        <input type="file" id="file2" accept="application/pdf">
        <button onclick="comparePDFs()">Összehasonlítás</button>
        <div>
            <label>Átlátszóság:</label>
            <input type="range" id="alphaSlider" min="0" max="1" step="0.01" value="0.5">
        </div>
        <div class="button-group">
            <button onclick="startBlinking()">Villogtatás</button>
            <button onclick="stopBlinking()">Villogtatás Leállítása</button>
            <button onclick="resetView()">Nézet Visszaállítása</button>
            <button onclick="saveCurrentView()">Aktuális Nézet Mentése</button>
        </div>
    </div>
    <div class="canvas-container" id="canvasContainer">
        <canvas id="canvas1"></canvas>
        <canvas id="canvas2"></canvas>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsPDF/2.5.1/jspdf.umd.min.js"></script>
    <script>
        let blinking = false;
        let blinkInterval;
        let scale = 1;
        let offsetX = 0, offsetY = 0;
        let isDragging = false;
        let startX, startY;
        let file1Name = '', file2Name = '';

        async function comparePDFs() {
            const file1 = document.getElementById('file1').files[0];
            const file2 = document.getElementById('file2').files[0];
            if (file1 && file2) {
                file1Name = file1.name;
                file2Name = file2.name;

                // Display PDFs
                await displayPDF(file1, 'canvas1');
                await displayPDF(file2, 'canvas2');

                // Adjust canvas sizes and positions
                fitCanvasesToContainer();
            } else {
                alert('Kérjük, válassza ki mindkét PDF fájlt.');
            }
        }

        async function displayPDF(file, canvasId) {
            const canvas = document.getElementById(canvasId);
            const context = canvas.getContext('2d');
            const reader = new FileReader();
            reader.onload = async function() {
                const pdfData = new Uint8Array(reader.result);
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                const pdf = await loadingTask.promise;
                const pageNumber = 1;
                const page = await pdf.getPage(pageNumber);

                const viewport = page.getViewport({scale: 1});
                
                // Set canvas dimensions to original PDF size
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                // Render the page
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                await page.render(renderContext).promise;

                // Ensure the canvas stays the same size as the PDF page
                canvas.style.width = `${viewport.width}px`;
                canvas.style.height = `${viewport.height}px`;
            };
            reader.readAsArrayBuffer(file);
        }

        function fitCanvasesToContainer() {
            const container = document.getElementById('canvasContainer');
            const canvas1 = document.getElementById('canvas1');
            const canvas2 = document.getElementById('canvas2');

            const maxWidth = Math.max(canvas1.width, canvas2.width);
            const maxHeight = Math.max(canvas1.height, canvas2.height);

            container.style.width = `${maxWidth}px`;
            container.style.height = `${maxHeight}px`;

            // Ensure the container can be scrolled if needed
            container.scrollLeft = 0;
            container.scrollTop = 0;
        }

        function updateAlpha() {
            const alpha = document.getElementById('alphaSlider').value;
            const canvas2 = document.getElementById('canvas2');
            canvas2.style.opacity = alpha;
        }

        document.getElementById('alphaSlider').addEventListener('input', updateAlpha);

        function startBlinking() {
            blinking = true;
            blink();
        }

        function stopBlinking() {
            blinking = false;
            clearInterval(blinkInterval);
        }

        function blink() {
            if (!blinking) return;
            const canvas2 = document.getElementById('canvas2');
            canvas2.style.opacity = canvas2.style.opacity == 0 ? 1 : 0;
            blinkInterval = setTimeout(blink, 500);
        }

        function resetView() {
            scale = 1;
            offsetX = 0;
            offsetY = 0;
            updateTransform();
        }

        function updateTransform() {
            const canvases = document.getElementsByTagName('canvas');
            for (let canvas of canvases) {
                canvas.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
            }
        }

        async function saveCurrentView() {
            const canvases = document.getElementsByTagName('canvas');
            if (canvases.length === 0) return;

            // Create a temporary canvas to combine the views
            const tempCanvas = document.createElement('canvas');
            const tempContext = tempCanvas.getContext('2d');

            // Calculate dimensions for the temporary canvas
            const container = document.querySelector('.canvas-container');
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            tempCanvas.width = containerWidth;
            tempCanvas.height = containerHeight;

            // Draw the canvases onto the temporary canvas
            for (const canvas of canvases) {
                tempContext.drawImage(canvas, 0, 0);
            }

            // Convert the temporary canvas to PNG
            const imgData = tempCanvas.toDataURL('image/png');

            // Create PDF
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'pt', 'a4');

            // Add the combined image
            pdf.addImage(imgData, 'PNG', 10, 10, 190, 277);

            // Add file names
            pdf.setFontSize(12);
            pdf.text(`File 1: ${file1Name}`, 10, 290);
            pdf.text(`File 2: ${file2Name}`, 10, 310);

            // Save the PDF
            pdf.save('saved_view.pdf');
        }

        window.addEventListener('resize', fitCanvasesToContainer);

        // Event listeners for dragging and zooming
        const container = document.querySelector('.canvas-container');
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - offsetX;
            startY = e.clientY - offsetY;
            container.style.cursor = 'grabbing';
        });

        container.addEventListener('mouseup', () => {
            isDragging = false;
            container.style.cursor = 'grab';
        });

        container.addEventListener('mousemove', (e) => {
            if (isDragging) {
                offsetX = e.clientX - startX;
                offsetY = e.clientY - startY;
                updateTransform();
            }
        });

        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            const delta = e.deltaY > 0 ? 1 / zoomFactor : zoomFactor;
            scale *= delta;
            updateTransform();
        });
    </script>
</body>
</html>
