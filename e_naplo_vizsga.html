        question: "Ha a dokumentum szerint a projektigazgató és a jogász bevonása szükséges bizonyos naplóbejegyzések megfogalmazásába, milyen esetekben kötelező ez?",
        answers: [
          "Sosem kötelező, csak javaslat",
          "Komoly jogvitát előre vetítő, nagyobb költségkihatású ügyeknél, valamint ahol a szerződéses határidőt vagy összeget érintő módosítás merül fel",
          "Ha az építésvezető nem hajlandó részt venni",
          "Ha a megrendelő kéri"
        ],
        correct: 1
      }
    ];

    // -- 2) SEGÉDFÜGGVÉNYEK --------------------------------------------------

    // Véletlen elemsorrend keverés (Fisher–Yates shuffle)
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // Véletlenszerűen kiválaszt 'count' elemet a 'source' tömbből
    function getRandomSubset(source, count) {
      const copy = [...source];
      shuffleArray(copy);
      return copy.slice(0, count);
    }

    // -- 3) A KÉRDÉSEK KIVÁLASZTÁSA, MEGJELENÍTÉSE ---------------------------

    let selectedQuestions = []; // Ebben tároljuk a végleges (5 jogi, 7 szakmai, 5 doc) kérdéseket

    window.onload = function() {
      // Véletlenszerűen kiválasztjuk:
      const chosenLegal = getRandomSubset(legalQuestions, 5);
      const chosenGeneral = getRandomSubset(generalQuestions, 7);
      const chosenDoc = getRandomSubset(docQuestions, 5);

      // Összefűzzük a három csoportot
      selectedQuestions = [...chosenLegal, ...chosenGeneral, ...chosenDoc];

      // Megjelenítés
      displayQuestions();
    };

    function displayQuestions() {
      const container = document.getElementById("question-container");
      container.innerHTML = ""; // Töröljük, ha volt ott valami

      // Végigmegyünk a selectedQuestions tömbön, és minden kérdést kiírunk
      selectedQuestions.forEach((q, index) => {
        // Létrehozunk egy divet a kérdéshez
        const questionDiv = document.createElement("div");
        questionDiv.classList.add("question-block");

        // Kérdés szövege
        const questionTitle = document.createElement("p");
        questionTitle.innerHTML = `<strong>${index + 1}. ${q.question}</strong>`;
        questionDiv.appendChild(questionTitle);

        // Válaszok (radio gombok)
        q.answers.forEach((ans, ansIndex) => {
          const radioId = `q${index}_ans${ansIndex}`;
          const label = document.createElement("label");
          label.setAttribute("for", radioId);

          const input = document.createElement("input");
          input.type = "radio";
          input.name = `question_${index}`;
          input.id = radioId;
          input.value = ansIndex;

          label.appendChild(input);
          label.appendChild(document.createTextNode(" " + ans));
          questionDiv.appendChild(label);

          // sortörés
          questionDiv.appendChild(document.createElement("br"));
        });

        container.appendChild(questionDiv);
      });
    }

    // -- 4) ÉRTÉKELÉS --------------------------------------------------------
    function checkAnswers() {
      let correctCount = 0;
      selectedQuestions.forEach((q, index) => {
        // Megnézzük, melyik radio van kiválasztva
        const radios = document.getElementsByName(`question_${index}`);
        let userAnswer = -1;
        for (let r of radios) {
          if (r.checked) {
            userAnswer = parseInt(r.value);
            break;
          }
        }
        if (userAnswer === q.correct) {
          correctCount++;
        }
      });

      const total = selectedQuestions.length;
      const scorePercent = (correctCount / total) * 100;

      let resultText = `Eredményed: ${correctCount}/${total} ( ${scorePercent.toFixed(0)}% ). `;
      if (scorePercent >= 80) {
        resultText += "Gratulálok, megfeleltél!";
      } else {
        resultText += "Sajnos nem éri el a 80%-ot, próbáld újra!";
      }

      document.getElementById("result").innerText = resultText;
    }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      max-width: 800px;
    }
    h1, h2 {
      color: #333;
    }
    .question-block {
      margin-bottom: 1.5em;
      padding: 0.5em;
      border-bottom: 1px solid #ccc;
    }
    #result {
      font-weight: bold;
      margin-top: 20px;
      white-space: pre-wrap;
    }
    .btn {
      display: inline-block;
      padding: 0.6em 1em;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      cursor: pointer;
      margin: 1em 0;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

<h1>E-napló Vizsga - Véletlenszerű Kérdéssor</h1>
<p>A lap minden frissítésénél / megnyitásánál új, véletlenszerű kérdéssort kapsz. A kérdéssor 5 jogi, 7 általános szakmai és 5 munkautasításból vett kérdést tartalmaz. Válaszd ki a helyes válaszokat, majd a lap alján nyomd meg az "<strong>Eredmény értékelése</strong>" gombot!</p>

<div id="question-container"></div>

<button class="btn" onclick="checkAnswers()">Eredmény értékelése</button>
<div id="result"></div>

</body>
</html>
