        // Összehasonlító diagram
        function generateComparisonChart() {
            if (projects.length === 0) {
                alert('Nincsenek projektek az összehasonlításhoz!');
                return;
            }

            const comparisonData = projects.map(project => {
                const startDate = new Date(project.startDate);
                const endDate = new Date(project.endDate);
                const duration = Math.ceil((endDate - startDate) / (1000 * 60 * 60 * 24));
                
                return {
                    name: project.name,
                    duration: duration,
                    assignmentCount: project.assignments.length,
                    totalCapacity: project.assignments.reduce((sum, a) => sum + a.perc, 0)
                };
            });

            let chartText = 'PROJEKT ÖSSZEHASONLÍTÁS\n\n';
            comparisonData.forEach(project => {
                chartText += `${project.name}:\n`;
                chartText += `  Időtartam: ${project.duration} nap\n`;
                chartText += `  Dolgozók száma: ${project.assignmentCount}\n`;
                chartText += `  Összes kapacitás: ${project.totalCapacity}%\n\n`;
            });

            alert(chartText);
        }

        // Állapot mentése
        function saveState() {
            try {
                const state = {
                    projects: projects,
                    employees: employees,
                    timestamp: new Date().toISOString(),
                    version: '1.0'
                };
                localStorage.setItem('hunep-resource-state', JSON.stringify(state));
                alert('Állapot sikeresen elmentve!');
            } catch (error) {
                console.error('Mentési hiba:', error);
                alert('Hiba történt a mentés során!');
            }
        }

        // Állapot betöltése
        function loadState() {
            try {
                const saved = localStorage.getItem('hunep-resource-state');
                if (saved) {
                    const state = JSON.parse(saved);
                    if (confirm(`Betölti a mentett állapotot? (${new Date(state.timestamp).toLocaleString('hu-HU')})\nA jelenlegi adatok elvesznek!`)) {
                        projects = state.projects || [];
                        employees = state.employees || [];
                        renderProjects();
                        renderEmployees();
                        alert('Állapot sikeresen betöltve!');
                    }
                } else {
                    alert('Nincs mentett állapot!');
                }
            } catch (error) {
                console.error('Betöltési hiba:', error);
                alert('Hiba történt a betöltés során!');
            }
        }

        // PDF mentés
        function saveToPDF() {
            if (typeof jsPDF === 'undefined') {
                alert('PDF könyvtár nem elérhető!');
                return;
            }

            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Fejléc
                doc.setFontSize(18);
                doc.text('Hunep - Erőforrás Hozzárendelés', 20, 20);
                
                doc.setFontSize(12);
                doc.text(`Generálva: ${new Date().toLocaleString('hu-HU')}`, 20, 30);

                let y = 50;

                // Projektek
                doc.setFontSize(14);
                doc.text('PROJEKTEK:', 20, y);
                y += 10;

                projects.forEach((project, index) => {
                    if (y > 270) { // Új oldal
                        doc.addPage();
                        y = 20;
                    }

                    doc.setFontSize(12);
                    doc.text(`${index + 1}. ${project.name}`, 20, y);
                    y += 8;
                    
                    doc.setFontSize(10);
                    doc.text(`Időtartam: ${project.startDate} - ${project.endDate}`, 30, y);
                    y += 6;
                    
                    if (project.assignments && project.assignments.length > 0) {
                        doc.text('Hozzárendelések:', 30, y);
                        y += 6;
                        
                        project.assignments.forEach(assignment => {
                            if (y > 270) {
                                doc.addPage();
                                y = 20;
                            }
                            doc.text(`• ${assignment.name} (${assignment.role}) - ${assignment.perc}%`, 40, y);
                            y += 5;
                        });
                    } else {
                        doc.text('Nincs hozzárendelés', 30, y);
                        y += 6;
                    }
                    y += 5;
                });

                // Dolgozók áttekintése
                if (y > 200) {
                    doc.addPage();
                    y = 20;
                }

                doc.setFontSize(14);
                doc.text('DOLGOZÓK ÖSSZESÍTÉSE:', 20, y);
                y += 10;

                const roleGroups = employees.reduce((groups, emp) => {
                    if (!groups[emp.role]) groups[emp.role] = [];
                    groups[emp.role].push(emp);
                    return groups;
                }, {});

                Object.keys(roleGroups).forEach(role => {
                    if (y > 270) {
                        doc.addPage();
                        y = 20;
                    }
                    
                    doc.setFontSize(11);
                    doc.text(`${role} (${roleGroups[role].length} fő):`, 20, y);
                    y += 6;
                    
                    doc.setFontSize(9);
                    roleGroups[role].forEach(emp => {
                        if (y > 270) {
                            doc.addPage();
                            y = 20;
                        }
                        doc.text(`• ${emp.name}`, 30, y);
                        y += 4;
                    });
                    y += 4;
                });

                doc.save(`hunep-eroforras-hozzarendeles-${new Date().toISOString().split('T')[0]}.pdf`);
            } catch (error) {
                console.error('PDF generálási hiba:', error);
                alert('Hiba történt a PDF generálás során!');
            }
        }

        function showTab(tab) {

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey) {
                switch(e.key) {
                    case 's':
                        e.preventDefault();
                        saveState();
                        break;
                    case 'o':
                        e.preventDefault();
                        loadState();
                        break;
                    case 'n':
                        e.preventDefault();
                        if (e.shiftKey) {
                            showNewEmployeeModal();
                        } else {
                            document.getElementById('projectNameInput').focus();
                        }
                        break;
                    case 'g':
                        e.preventDefault();
                        generateGanttChart();
                        break;
                }
            }
            
            if (e.key === 'Escape') {
                closePercentageModal();
                closeNewEmployeeModal();
                closeGanttModal();
            }
        });

        // Modal click outside bezárás
        window.addEventListener('click', function(e) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });

        console.log('Hunep Erőforrás Hozzárendelés rendszer betöltve');

            // Projektek renderelése
            function renderProjects() {
                const projectsSection = document.getElementById("projectsSection");
                projectsSection.innerHTML = "";
                projects.forEach(proj => {
                    let projDiv = document.createElement("div");
                    projDiv.className = "project";
                    projDiv.draggable = true;
                    projDiv.dataset.projectId = proj.id;
                    projDiv.innerHTML = `
                        <div class="project-header">
                            <h3 contenteditable="true" onblur="updateProjectName(this)">${proj.name}</h3>
                            <button class="delete-project" onclick="deleteProject(this)">X</button>
                        </div>
                        <label>Kezdő dátum:<br><input type="date" id="start-date-${proj.id}" value="${proj.start}" /></label><br>
                        <label>Végdátum:<br><input type="date" id="end-date-${proj.id}" value="${proj.end}" /></label>
                        <div class="assignments"></div>
                    `;
                    projDiv.addEventListener("dragstart", projectDragStart);
                    projDiv.addEventListener("dragend", projectDragEnd);
                    projDiv.addEventListener("dragover", projectDragOver);
                    projDiv.addEventListener("drop", projectDrop);
                    // Ezen események biztosítják, hogy a dolgozók áthúzhatók legyenek a projektbe is
                    projDiv.addEventListener("dragover", dragOver);

            // Projekt név frissítése (onblur)
            function updateProjectName(h3) {
                let projectElem = h3.closest('.project');
                let projectId = projectElem.dataset.projectId;
                let newName = h3.textContent.trim();
                let proj = projects.find(p => p.id == projectId);
                if (proj) {
                    proj.name = newName;
                }
            }
    
            // Projekt törlése
            function deleteProject(btn) {
                let projectElem = btn.closest('.project');
                let projectId = projectElem.dataset.projectId;
                projectElem.parentNode.removeChild(projectElem);
                projects = projects.filter(p => p.id != projectId);
            }
    
            // Projektek sorrendjének frissítése (drag & drop)
            function updateProjectsOrder() {
                let newOrder = [];
                let projectElems = document.querySelectorAll("#projectsSection .project");
                projectElems.forEach(elem => {
                    let id = parseInt(elem.dataset.projectId);
                    let proj = projects.find(p => p.id == id);

                });

            // Projekt drag & drop események
            function projectDragStart(e) {
                e.dataTransfer.setData("project", e.currentTarget.dataset.projectId);
                e.currentTarget.classList.add("dragging");
            }
            function projectDragEnd(e) {
                e.currentTarget.classList.remove("dragging");
            }
            function projectDragOver(e) {
                e.preventDefault();
            }
            function projectDrop(e) {
                e.preventDefault();
                let draggedId = e.dataTransfer.getData("project");
                if (!draggedId) return;
                let draggedElem = document.querySelector(`.project[data-project-id='${draggedId}']`);
                if (!draggedElem || draggedElem === e.currentTarget) return;
                let projectsSection = document.getElementById("projectsSection");

                    projectsSection.insertBefore(draggedElem, e.currentTarget);

            // Dolgozók listájának megjelenítése (munkaköri csoportok szerint)
            function initEmployeeList() {
                const container = document.getElementById("employeesContainer");
                container.innerHTML = "";

                    if (employees[role].length > 0) {

                    e.target.classList.add("dragging");

            }

                e.preventDefault();

            // Dolgozó hozzárendelése egy projekthez
            function dropEmployee(e) {
                e.preventDefault();
                e.currentTarget.classList.remove("drag-over");
                const empId = e.dataTransfer.getData("text/plain");
                const emp = findEmployeeById(empId);
                if (!emp) {
                    alert("Hiba: a dolgozó nem található!");
                    return;
                }
                const perc = parseInt(prompt(`Hány százalékban szeretnéd hozzárendelni ${emp.name}-t? (Max: ${emp.available}%)`, "10"));
                if (isNaN(perc) || perc <= 0 || perc > emp.available) {
                    alert("Érvénytelen százalék!");
                    return;
                }
                emp.available -= perc;
                updateEmployeeUI(emp);
                const projDiv = e.currentTarget;
                const assignmentsDiv = projDiv.querySelector(".assignments");
                const newAssignment = { 
                    id: assignmentIdCounter++, 
                    empId: emp.id, 
                    name: emp.name, 
                    role: emp.role, 
                    perc: perc, 
                    projectId: parseInt(projDiv.dataset.projectId)
                };
                const projObj = projects.find(p => p.id === parseInt(projDiv.dataset.projectId));
                if (projObj) {
                    projObj.assignments.push(newAssignment);
                }
                const assignDiv = document.createElement("div");
                assignDiv.className = "assignment";
                assignDiv.textContent = `${emp.name} - ${perc}% (${emp.role})`;
                assignDiv.dataset.assignmentId = newAssignment.id;
                assignDiv.draggable = true;
                assignDiv.addEventListener("dragstart", assignmentDragStart);
                assignDiv.addEventListener("dragend", assignmentDragEnd);
                assignmentsDiv.appendChild(assignDiv);
            }
    
            // Segédfüggvény: dolgozó keresése
            function findEmployeeById(id) {
                for (const role in employees) {
                    for (const emp of employees[role]) {
                        if (emp.id == id) return emp;
                    }
                }
                return null;
            }
    
            // Dolgozói UI frissítése
            function updateEmployeeUI(emp) {
                const empDivs = document.querySelectorAll(`[data-emp-id='${emp.id}']`);
                empDivs.forEach(div => {
                    div.textContent = `${emp.name} (${emp.available}%)`;
                });
            }
    
            // Assignment drag események
            function assignmentDragStart(e) {
                const data = { assignmentId: e.target.dataset.assignmentId };
                e.dataTransfer.setData("assignment", JSON.stringify(data));
                e.target.classList.add("dragging");
            }
            function assignmentDragEnd(e) {
                e.target.classList.remove("dragging");
            }
            function assignmentReturnDragOver(e) {
                if (e.dataTransfer.types.includes("assignment")) {
                    e.preventDefault();
                    e.currentTarget.classList.add("drag-over");
                }
            }
            function assignmentReturnDragLeave(e) {
                e.currentTarget.classList.remove("drag-over");
            }
            function assignmentReturnDrop(e) {
                e.preventDefault();
                e.currentTarget.classList.remove("drag-over");
                const dataStr = e.dataTransfer.getData("assignment");
                if (!dataStr) return;
                const data = JSON.parse(dataStr);
                const assignmentId = data.assignmentId;
                const assignElem = document.querySelector(`[data-assignment-id='${assignmentId}']`);
                if (!assignElem) {
                    alert("A hozzárendelt elem nem található.");
                    return;
                }
                let targetEmpId = e.currentTarget.dataset.empId;
                let found = false;
                let projForAssignment = null;
                let assignmentObj = null;
                for (let proj of projects) {
                    for (let i = 0; i < proj.assignments.length; i++) {
                        if (proj.assignments[i].id == assignmentId) {
                            assignmentObj = proj.assignments[i];
                            projForAssignment = proj;
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }
                if (!found) {
                    alert("Nem található a hozzárendelt adat a projektben.");
                    return;
                }
                if (targetEmpId != assignmentObj.empId) {
                    alert("Ez nem a megfelelő dolgozó, akihez az erőforrás van rendelve.");
                    return;
                }
                let returnPerc = parseInt(prompt("Hány százalékot szeretnél visszatenni?", ""));
                if (isNaN(returnPerc) || returnPerc <= 0) {
                    alert("Érvénytelen százalék.");
                    return;
                }
                if (returnPerc > assignmentObj.perc) {
                    returnPerc = assignmentObj.perc;
                }
                assignmentObj.perc -= returnPerc;
                let emp = findEmployeeById(assignmentObj.empId);
                if (emp) {
                    emp.available += returnPerc;
                }
                if (assignmentObj.perc <= 0) {
                    assignElem.parentElement.removeChild(assignElem);
                    projForAssignment.assignments = projForAssignment.assignments.filter(a => a.id != assignmentId);
                } else {
                    assignElem.textContent = `${assignmentObj.name} - ${assignmentObj.perc}% (${assignmentObj.role})`;
                }
                updateEmployeeUI(emp);
            }

            // GANTT diagram generálása (a projekt dátumokat az aktuális input elemekből olvassa)
            function generateGanttChart() {
                const ganttContainer = document.getElementById("ganttContainer");
                ganttContainer.innerHTML = "";
      
                // Keressük meg a projektek közül azt a legkorábbi kezdő és legkésőbbi végdátumot,
                // amelynél a <input type="date"> elemekben érték szerepel.
                let minDate = null, maxDate = null;
                projects.forEach(proj => {
                    const startInput = document.getElementById(`start-date-${proj.id}`);
                    const endInput = document.getElementById(`end-date-${proj.id}`);
                    if (startInput && endInput && startInput.value && endInput.value) {
                        const startDate = new Date(startInput.value);
                        const endDate = new Date(endInput.value);
                        if (!minDate || startDate < minDate) minDate = startDate;
                        if (!maxDate || endDate > maxDate) maxDate = endDate;
                    }
                });
      
                if (!minDate || !maxDate) {
                    ganttContainer.innerHTML = "<p>Nincsenek érvényes dátumok a projektekhez.</p>";
                    return;
                }
      
                const totalDays = Math.ceil((maxDate - minDate) / (1000 * 3600 * 24)) + 1;
                const dayWidth = 10;
                const timelineWidth = totalDays * dayWidth;
      
                // Időskála (timeline header) két hetes bontással
                const timelineHeader = document.createElement("div");
                timelineHeader.className = "gantt-timeline-header";
                timelineHeader.style.width = timelineWidth + "px";
      
                let currentDate = new Date(minDate.getTime());
                while (currentDate <= maxDate) {
                    const diffDays = Math.floor((currentDate - minDate) / (1000 * 3600 * 24));
        
                    // Függőleges rácsvonal
                    const gridLine = document.createElement("div");
                    gridLine.style.position = "absolute";
                    gridLine.style.left = (diffDays * dayWidth) + "px";
                    gridLine.style.top = "0";
                    gridLine.style.height = "100%";
                    gridLine.style.width = "1px";
                    gridLine.style.backgroundColor = "#aaa";
                    timelineHeader.appendChild(gridLine);
        
                    // Dátum címke
                    const dateLabel = document.createElement("div");
                    dateLabel.style.position = "absolute";
                    dateLabel.style.left = (diffDays * dayWidth + 2) + "px";
                    dateLabel.style.top = "0";
                    dateLabel.style.fontSize = "10px";
                    dateLabel.style.color = "#000";
                    dateLabel.textContent = currentDate.toLocaleDateString();
                    timelineHeader.appendChild(dateLabel);
        
                    currentDate.setDate(currentDate.getDate() + 14);
                }
      
                ganttContainer.appendChild(timelineHeader);
      
                // Minden projekthez egy sor
                projects.forEach(proj => {
                    const rowDiv = document.createElement("div");
                    rowDiv.className = "gantt-row";
        
                    // Bal oldali címke
                    const labelDiv = document.createElement("div");
                    labelDiv.className = "gantt-label";
                    labelDiv.textContent = proj.name;
                    rowDiv.appendChild(labelDiv);
        
                    // Tartalom
                    const contentDiv = document.createElement("div");
                    contentDiv.className = "gantt-row-content";
                    contentDiv.style.width = timelineWidth + "px";
        
                    const startInput = document.getElementById(`start-date-${proj.id}`);
                    const endInput = document.getElementById(`end-date-${proj.id}`);
                    if (startInput && endInput && startInput.value && endInput.value) {
                        const projStart = new Date(startInput.value);
                        const projEnd = new Date(endInput.value);
                        const offsetDays = Math.floor((projStart - minDate) / (1000 * 3600 * 24));
                        const durationDays = Math.ceil((projEnd - projStart) / (1000 * 3600 * 24)) + 1;
          
                        const barDiv = document.createElement("div");
                        barDiv.className = "gantt-bar";
                        barDiv.style.left = (offsetDays * dayWidth) + "px";
                        barDiv.style.width = (durationDays * dayWidth) + "px";
                        barDiv.style.height = "30px";
                        barDiv.style.top = "10px";
                        barDiv.style.lineHeight = "30px";
                        barDiv.textContent = `${projStart.toLocaleDateString()} - ${projEnd.toLocaleDateString()}`;
                        contentDiv.appendChild(barDiv);
                    } else {
                        const barDiv = document.createElement("div");
                        barDiv.className = "gantt-bar";
                        barDiv.style.left = "0";
                        barDiv.style.width = "100px";
                        barDiv.style.height = "30px";
                        barDiv.style.top = "10px";
                        barDiv.style.lineHeight = "30px";
                        barDiv.textContent = "Nincs dátum";
                        contentDiv.appendChild(barDiv);
                    }
                    rowDiv.appendChild(contentDiv);
                    ganttContainer.appendChild(rowDiv);
                });
            }

            function showMainScreen() {
                document.getElementById("mainScreen").style.display = "flex";
                document.getElementById("ganttScreen").style.display = "none";
            }
            function showGanttScreen() {
                document.getElementById("mainScreen").style.display = "none";
                document.getElementById("ganttScreen").style.display = "block";
            }
    
            // Állapot mentése (localStorage)
            function saveState() {
                const state = {
                    employees: employees,
                    projects: projects,
                    employeeIdCounter: employeeIdCounter,
                    assignmentIdCounter: assignmentIdCounter
                };
                localStorage.setItem("projectState", JSON.stringify(state));
                alert("Állapot mentve.");
            }
    
            // Állapot betöltése (localStorage)
            function loadState() {
                const stateStr = localStorage.getItem("projectState");
                if (!stateStr) {
                    alert("Nincs elmentett állapot.");
                    return;
                }
                const state = JSON.parse(stateStr);
                applyLoadedState(state);
                alert("Állapot betöltve.");
            }
    
            // Apply state object (used by loadState and import)
            function applyLoadedState(state) {
                employees = state.employees || {};
                projects = state.projects || [];
                employeeIdCounter = state.employeeIdCounter || 0;
                assignmentIdCounter = state.assignmentIdCounter || 0;
                initEmployeeList();
                renderProjects();
            }
    
            // Exportálás JSON fájlba (letöltés)
            function exportState() {
                const state = {
                    employees: employees,
                    projects: projects,
                    employeeIdCounter: employeeIdCounter,
                    assignmentIdCounter: assignmentIdCounter
                };
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'hunep_state.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
    
            // Importálás JSON fájlból (file input esemény)
            function importStateFromFile(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const state = JSON.parse(ev.target.result);
                        applyLoadedState(state);
                        // also save to localStorage for convenience
                        localStorage.setItem('projectState', JSON.stringify(state));
                        alert('Állapot importálva és elmentve a helyi tárolóba.');
                    } catch (err) {
                        alert('Hiba a fájl feldolgozása során: ' + err.message);
                    }
                };
                reader.readAsText(file);
                // reset input
                e.target.value = '';
            }
    
            // Mentés PDF-ként
            function savePDF() {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFont("Helvetica");
                projects.forEach((proj, index) => {
                    if (index > 0) doc.addPage();
                    doc.setFontSize(18);
                    doc.text(`Projekt ${proj.id}: ${proj.name}`, 10, 20);
                    doc.setFontSize(12);
                    doc.setFillColor(230, 230, 230);
                    doc.rect(10, 30, 50, 10, "FD");
                    doc.text(`Sorszám: ${proj.id}`, 12, 38);
                    doc.rect(10, 42, 100, 10, "FD");
                    doc.text(`Név: ${proj.name}`, 12, 50);
                    const startDate = (() => {
                        const input = document.getElementById(`start-date-${proj.id}`);
                        return input && input.value ? input.value : "Nincs megadva";
                    })();
                    doc.rect(10, 54, 80, 10, "FD");
                    doc.text(`Kezdő dátum: ${startDate}`, 12, 62);
                    const endDate = (() => {
                        const input = document.getElementById(`end-date-${proj.id}`);
                        return input && input.value ? input.value : "Nincs megadva";
                    })();
                    doc.rect(10, 66, 80, 10, "FD");
                    doc.text(`Végdátum: ${endDate}`, 12, 74);
                    doc.setFontSize(14);
                    doc.text("Hozzárendelt dolgozók:", 10, 85);
                    doc.setFontSize(12);
                    let y = 95;
                    if (proj.assignments && proj.assignments.length > 0) {
                        proj.assignments.forEach(assign => {
                            doc.text(`${assign.name} - ${assign.perc}% (${assign.role})`, 10, y);
                            y += 8;
                        });
                    } else {
                        doc.text("Nincs hozzárendelt dolgozó.", 10, y);
                    }
                });
                doc.save("projektek.pdf");
            }
    
            // Oldal betöltésekor: dolgozói lista és projektek renderelése
            window.onload = function() {
                initEmployeeList();
                renderProjects();
                showMainScreen();
            };
        </script>
</body>
</html>
