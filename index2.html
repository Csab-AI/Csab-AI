<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Comparator - Excel to Canvas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .menu {
            display: flex;
            flex-direction: column;
            width: 300px;
            padding: 10px;
            box-sizing: border-box;
            border-right: 1px solid #000;
        }
        .menu button, .menu input {
            margin-bottom: 10px;
        }
        #canvasContainer {
            position: relative;
            flex-grow: 1;
            border: 1px solid #000;
            overflow: hidden;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu">
            <div class="section">
                <h2>Load PDFs from Excel</h2>
                <label for="excelFile">Select Excel File:</label>
                <input type="file" id="excelFile" accept=".xlsx">
                <button onclick="loadAndComparePDFs()">Load and Compare PDFs</button>
            </div>
        </div>
        <div id="canvasContainer">
            <canvas id="canvas1"></canvas>
            <canvas id="canvas2"></canvas>
        </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <script>
        async function loadAndComparePDFs() {
            const excelFile = document.getElementById('excelFile').files[0];
            if (excelFile) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, {header: 1});

                    const file1Path = rows[1][0]?.replace(/\\/g, '\\\\');
                    const file2Path = rows[1][1]?.replace(/\\/g, '\\\\');

                    if (file1Path && file2Path) {
                        await displayPDF(file1Path, 'canvas1', 1);   // File 1 full opacity
                        await displayPDF(file2Path, 'canvas2', 0.5); // File 2 50% opacity
                        fitCanvasesToContainer();
                    } else {
                        alert('Error: Could not find valid file paths in the Excel file.');
                    }
                };
                reader.readAsArrayBuffer(excelFile);
            } else {
                alert('Please select an Excel file.');
            }
        }

        async function displayPDF(filePath, canvasId, opacity) {
            try {
                const pdf = await pdfjsLib.getDocument(filePath).promise;
                const pageNumber = 1;
                const page = await pdf.getPage(pageNumber);
                const viewport = page.getViewport({scale: 1});

                const canvas = document.getElementById(canvasId);
                const context = canvas.getContext('2d');
                const container = document.getElementById('canvasContainer');
                const scaleX = container.clientWidth / viewport.width;
                const scaleY = container.clientHeight / viewport.height;
                const scale = Math.min(scaleX, scaleY);
                const scaledViewport = page.getViewport({scale: scale});

                canvas.width = scaledViewport.width;
                canvas.height = scaledViewport.height;

                context.globalAlpha = opacity;  // Set the opacity for the canvas

                const renderContext = {
                    canvasContext: context,
                    viewport: scaledViewport
                };
                await page.render(renderContext).promise;
            } catch (error) {
                console.error(`Failed to load PDF: ${filePath}. Error: ${error}`);
                alert(`Failed to load PDF: ${filePath}`);
            }
        }

        function fitCanvasesToContainer() {
            const canvases = document.getElementsByTagName('canvas');
            for (let canvas of canvases) {
                canvas.style.width = '100%';
                canvas.style.height = '100%';
            }
        }
    </script>
</body>
</html>
